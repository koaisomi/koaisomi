<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Koaisomi - AI automations, built to run themselves. Jolly Reil Luna, AI Automation Engineer and Systems Architect.">
<title>Koaisomi - Jolly Reil Luna</title>
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#6D5AE6"/><stop offset="0.5" stop-color="#0F9F8E"/><stop offset="1" stop-color="#6D5AE6"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="acc2" gradientUnits="userSpaceOnUse" x1="750" y1="0" x2="1140" y2="0">
  <stop offset="0" stop-color="#6D5AE6"/><stop offset="1" stop-color="#0F9F8E"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#E4E4DE"/></pattern>
<radialGradient id="glow" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#6D5AE6" stop-opacity="0.18"/><stop offset="1" stop-color="#6D5AE6" stop-opacity="0"/></radialGradient>
<style>
.m{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',monospace;font-size:15px}
.s{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ln,.st{opacity:0;animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-out}
@keyframes ln0{0%,6.67%{opacity:0;transform:translateX(-6px)}8.75%,94%{opacity:1;transform:none}100%{opacity:0}}@keyframes st0{0%,11.67%{opacity:0}12.92%,94%{opacity:1}100%{opacity:0}}@keyframes wt0{0%,6.67%{opacity:0}8.33%,11.67%{opacity:1}12.50%,100%{opacity:0}}@keyframes ln1{0%,17.50%{opacity:0;transform:translateX(-6px)}19.58%,94%{opacity:1;transform:none}100%{opacity:0}}@keyframes st1{0%,22.50%{opacity:0}23.75%,94%{opacity:1}100%{opacity:0}}@keyframes wt1{0%,17.50%{opacity:0}19.17%,22.50%{opacity:1}23.33%,100%{opacity:0}}@keyframes ln2{0%,28.33%{opacity:0;transform:translateX(-6px)}30.42%,94%{opacity:1;transform:none}100%{opacity:0}}@keyframes st2{0%,33.33%{opacity:0}34.58%,94%{opacity:1}100%{opacity:0}}@keyframes wt2{0%,28.33%{opacity:0}30.00%,33.33%{opacity:1}34.17%,100%{opacity:0}}@keyframes ln3{0%,39.17%{opacity:0;transform:translateX(-6px)}41.25%,94%{opacity:1;transform:none}100%{opacity:0}}@keyframes st3{0%,44.17%{opacity:0}45.42%,94%{opacity:1}100%{opacity:0}}@keyframes wt3{0%,39.17%{opacity:0}40.83%,44.17%{opacity:1}45.00%,100%{opacity:0}}@keyframes ln4{0%,50.00%{opacity:0;transform:translateX(-6px)}52.08%,94%{opacity:1;transform:none}100%{opacity:0}}@keyframes st4{0%,55.00%{opacity:0}56.25%,94%{opacity:1}100%{opacity:0}}@keyframes wt4{0%,50.00%{opacity:0}51.67%,55.00%{opacity:1}55.83%,100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 12s linear infinite}
@keyframes bar{0%{transform:scaleX(0)}60.83%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}.wt{display:none}}
</style>
</defs>
<rect width="1200" height="400" rx="20" fill="#FAFAF7"/>
<rect width="1200" height="400" rx="20" fill="url(#dots)" opacity=".6"/>
<rect width="1200" height="400" rx="20" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="399" rx="20" fill="none" stroke="#E4E4DE"/>

<g class="up d1">
  <circle cx="66" cy="96" r="5" fill="#059669"/><circle class="pulse" cx="66" cy="96" r="5" fill="#059669"/>
  <text x="82" y="101" class="m" font-size="13" letter-spacing="2" fill="#5D6372">KOAISOMI  /  PHILIPPINES  /  UTC+8</text>
</g>
<text x="60" y="180" class="s up d2" font-size="50" font-weight="700" fill="#14161C" letter-spacing="-1">AI automations,</text>
<text x="60" y="240" class="s up d3" font-size="50" font-weight="700" fill="#14161C" letter-spacing="-1">built to <tspan fill="url(#acc)">run themselves.</tspan></text>
<text x="62" y="292" class="s up d4" font-size="18" fill="#5D6372">Jolly Reil Luna  ·  AI Automation Engineer  ·  Systems Architect</text>

<g class="up d3">
  <rect x="750" y="76" width="390" height="268" rx="14" fill="#FFFFFF" stroke="#E4E4DE"/>
  <circle cx="772" cy="100" r="5" fill="#E4E4DE"/><circle cx="790" cy="100" r="5" fill="#E4E4DE"/><circle cx="808" cy="100" r="5" fill="#E4E4DE"/>
  <text x="830" y="105" class="m" font-size="13" fill="#5D6372">maxim.log</text>
  <text x="1116" y="105" class="m" font-size="13" text-anchor="end" fill="#059669">● agents on</text>
  <rect x="750" y="121" width="390" height="2" fill="#E4E4DE"/>
  <rect class="bar" x="750" y="121" width="390" height="2" fill="url(#acc2)"/>
<g class="ln" style="animation-name:ln0">
  <text x="772" y="160" class="m" fill="#9AA0AE">hq</text>
  <text x="822" y="160" class="m" fill="#14161C">ground-zero-hq</text>
</g>
<text x="1116" y="160" class="m st" text-anchor="end" fill="#9AA0AE" style="animation-name:wt0">...</text>
<text x="1116" y="160" class="m st" text-anchor="end" fill="#059669" style="animation-name:st0">live</text>
<g class="ln" style="animation-name:ln1">
  <text x="772" y="194" class="m" fill="#9AA0AE">ext</text>
  <text x="822" y="194" class="m" fill="#14161C">job-fit-scorer</text>
</g>
<text x="1116" y="194" class="m st" text-anchor="end" fill="#9AA0AE" style="animation-name:wt1">...</text>
<text x="1116" y="194" class="m st" text-anchor="end" fill="#059669" style="animation-name:st1">public</text>
<g class="ln" style="animation-name:ln2">
  <text x="772" y="228" class="m" fill="#9AA0AE">ext</text>
  <text x="822" y="228" class="m" fill="#14161C">capture-to-post</text>
</g>
<text x="1116" y="228" class="m st" text-anchor="end" fill="#9AA0AE" style="animation-name:wt2">...</text>
<text x="1116" y="228" class="m st" text-anchor="end" fill="#059669" style="animation-name:st2">shipped</text>
<g class="ln" style="animation-name:ln3">
  <text x="772" y="262" class="m" fill="#9AA0AE">bot</text>
  <text x="822" y="262" class="m" fill="#14161C">maps-lead-scraper</text>
</g>
<text x="1116" y="262" class="m st" text-anchor="end" fill="#9AA0AE" style="animation-name:wt3">...</text>
<text x="1116" y="262" class="m st" text-anchor="end" fill="#B45309" style="animation-name:st3">running</text>
<g class="ln" style="animation-name:ln4">
  <text x="772" y="296" class="m" fill="#9AA0AE">app</text>
  <text x="822" y="296" class="m" fill="#14161C">maxim-desktop</text>
</g>
<text x="1116" y="296" class="m st" text-anchor="end" fill="#9AA0AE" style="animation-name:wt4">...</text>
<text x="1116" y="296" class="m st" text-anchor="end" fill="#B45309" style="animation-name:st4">building</text>

  <text x="772" y="330" class="m" fill="#0F9F8E">&gt; <tspan fill="#5D6372">next build</tspan> <tspan class="blink" fill="#14161C">▌</tspan></text>
</g>
</svg>
