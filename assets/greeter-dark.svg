<style>
.say{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',monospace;font-size:24px;font-weight:700;letter-spacing:2px;fill:#E8EAF0}
.arm{transform-origin:206px 206px;animation:wave 1.4s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-10deg)}to{transform:rotate(16deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mouth{transform-box:fill-box;transform-origin:center;animation:talk 10s linear infinite}
@keyframes talk{0%{transform:scaleY(.3)}6%{transform:scaleY(1)}7.2%{transform:scaleY(0.3)}8.4%{transform:scaleY(1)}9.6%{transform:scaleY(0.3)}10.8%{transform:scaleY(1)}12%{transform:scaleY(0.3)}13.2%{transform:scaleY(1)}14.4%{transform:scaleY(0.3)}15.6%{transform:scaleY(1)}16.8%{transform:scaleY(0.3)}18%{transform:scaleY(1)}19.2%{transform:scaleY(0.3)}20.4%{transform:scaleY(1)}21.6%{transform:scaleY(0.3)}22.8%{transform:scaleY(1)}23.05%{transform:scaleY(.3)}26.55%{transform:scaleY(1)}27.75%{transform:scaleY(0.3)}28.95%{transform:scaleY(1)}30.15%{transform:scaleY(0.3)}31.35%{transform:scaleY(1)}32.55%{transform:scaleY(0.3)}33.75%{transform:scaleY(1)}34.95%{transform:scaleY(0.3)}36.15%{transform:scaleY(1)}37.35%{transform:scaleY(0.3)}38.55%{transform:scaleY(1)}39.75%{transform:scaleY(0.3)}40.95%{transform:scaleY(1)}42.15%{transform:scaleY(0.3)}42.5%{transform:scaleY(.3)}46%{transform:scaleY(1)}47.2%{transform:scaleY(0.3)}48.4%{transform:scaleY(1)}49.6%{transform:scaleY(0.3)}50.8%{transform:scaleY(1)}52%{transform:scaleY(0.3)}53.2%{transform:scaleY(1)}54.4%{transform:scaleY(0.3)}55.6%{transform:scaleY(1)}56.8%{transform:scaleY(0.3)}58%{transform:scaleY(1)}59.2%{transform:scaleY(0.3)}59.75%{transform:scaleY(.3)}100%{transform:scaleY(.3)}}
.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(3px)}}
.cur{animation:cur 1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
.curw{opacity:0;animation:curw 10s steps(1) infinite}
@keyframes curw{0%{opacity:0}59.75%{opacity:1}96%{opacity:0}}
@media (prefers-reduced-motion:reduce){.arm,.eye,.mouth,.bob,.cur{animation:none}}
</style>
</defs>
<rect width="1200" height="260" rx="20" fill="#0B0D12"/>
<rect x=".5" y=".5" width="1199" height="259" rx="20" fill="none" stroke="#232836"/>

<g class="bob">
  <!-- waving arm (behind body) -->
  <g class="arm">
    <path d="M206 206 L246 128" stroke="#8B7CF6" stroke-width="24" stroke-linecap="round"/>
    <circle cx="250" cy="120" r="14" fill="#E3A97F"/>
  </g>
  <!-- hoodie -->
  <path d="M82 262 Q86 206 120 196 L180 196 Q214 206 218 262 Z" fill="#8B7CF6"/>
  <path d="M136 196 L150 222 L164 196 Z" fill="#0B0D12" opacity=".35"/>
  <rect x="140" y="172" width="20" height="26" rx="6" fill="#E3A97F"/>
  <!-- head -->
  <circle cx="150" cy="128" r="48" fill="#E3A97F"/>
  <path d="M100 126 Q96 74 150 72 Q206 74 200 126 Q192 98 162 96 Q156 108 132 104 Q112 108 100 126 Z" fill="#1E1A22"/>
  <!-- headset -->
  <path d="M100 128 Q100 66 150 66 Q200 66 200 128" fill="none" stroke="#2DD4BF" stroke-width="6"/>
  <rect x="92" y="118" width="14" height="26" rx="6" fill="#2DD4BF"/>
  <rect x="194" y="118" width="14" height="26" rx="6" fill="#2DD4BF"/>
  <path d="M100 142 Q104 168 132 166" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="134" cy="166" r="4" fill="#2DD4BF"/>
  <!-- face -->
  <ellipse class="eye" cx="133" cy="130" rx="5" ry="6" fill="#1E1A22"/>
  <ellipse class="eye" cx="167" cy="130" rx="5" ry="6" fill="#1E1A22"/>
  <circle cx="124" cy="148" r="7" fill="#F28B82" opacity=".35"/>
  <circle cx="176" cy="148" r="7" fill="#F28B82" opacity=".35"/>
  <ellipse class="mouth" cx="152" cy="154" rx="9" ry="7" fill="#7A2E2E"/>
</g>

<polygon points="312,30 1160,30 1160,38 1168,38 1168,222 1160,222 1160,230 312,230 312,222 304,222 304,150 294,150 294,142 284,142 284,134 274,134 274,126 304,126 304,38 312,38" fill="#12151C" stroke="#E8EAF0" stroke-width="4" shape-rendering="crispEdges"/>
<text x="340" y="88" class="say" clip-path="url(#c0)">HI, I'M JOLLY. THE CARTOON ONE.</text>
<text x="340" y="138" class="say" clip-path="url(#c1)">I BUILD AI AGENTS THAT HANDLE</text>
<text x="340" y="188" class="say" clip-path="url(#c2)">THE BUSY WORK. SEE BELOW.</text>
<rect class="curw" x="754" y="166" width="14" height="24" fill="#2DD4BF"><animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect>
</svg>
